<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Teacher Login | FMPS</title>


    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="../../css/style.css">


    <!-- =====================================================
                    TEACHER LOGIN EXTRA CSS
    ====================================================== -->

    <style>

        /* =====================================================
                        LOGIN CARD
        ====================================================== */

        .teacher-login-card{
            border-radius:24px;
            padding:35px;

            transition:
                transform .3s ease,
                box-shadow .3s ease;
        }


        .teacher-login-card:hover{
            transform:translateY(-3px);
        }


        /* =====================================================
                        TEACHER ICON
        ====================================================== */

        .teacher-login-icon{
            color:#6f42c1;
        }


        /* =====================================================
                        TEACHER BADGE
        ====================================================== */

        .teacher-portal-badge{

            display:inline-block;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #22d3ee
                );

            color:#ffffff;

            padding:9px 24px;

            border-radius:30px;

            font-weight:700;

            font-size:14px;

            margin-bottom:8px;

            box-shadow:
                0 5px 15px
                rgba(34,211,238,.20);
        }


        /* =====================================================
                        LOGIN BUTTON
        ====================================================== */

        .teacher-login-btn{

            width:100%;

            min-height:52px;

            border:none;

            border-radius:30px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #22d3ee
                );

            color:#ffffff;

            font-size:16px;

            font-weight:700;

            transition:.3s ease;
        }


        .teacher-login-btn:hover{

            color:#ffffff;

            transform:translateY(-2px);

            box-shadow:
                0 8px 22px
                rgba(37,99,235,.30);
        }


        /* =====================================================
                            DIVIDER
        ====================================================== */

        .login-divider{

            display:flex;

            align-items:center;

            gap:12px;

            margin:20px 0;
        }


        .login-divider::before,
        .login-divider::after{

            content:"";

            flex:1;

            height:1px;

            background:
                rgba(148,163,184,.35);
        }


        .login-divider span{

            color:#94a3b8;

            font-size:12px;

            font-weight:700;
        }


        /* =====================================================
                        FACE LOGIN BUTTON
        ====================================================== */

        .face-login-btn{

            width:100%;

            min-height:54px;

            border:none;

            border-radius:30px;

            padding:10px 20px;

            background:
                linear-gradient(
                    135deg,
                    #6f42c1,
                    #2563eb,
                    #06b6d4
                );

            color:#ffffff;

            display:flex;

            align-items:center;

            justify-content:center;

            gap:10px;

            font-size:15px;

            font-weight:700;

            cursor:pointer;

            transition:
                transform .3s ease,
                box-shadow .3s ease;
        }


        .face-login-btn i{

            color:#ffffff;

            font-size:20px;
        }


        .face-login-btn:hover{

            transform:translateY(-2px);

            box-shadow:
                0 9px 25px
                rgba(6,182,212,.35);
        }


        .face-login-btn:active{

            transform:scale(.98);
        }


        /* =====================================================
                            AI BADGE
        ====================================================== */

        .face-ai-badge{

            padding:3px 8px;

            border-radius:20px;

            background:
                rgba(255,255,255,.20);

            border:
                1px solid
                rgba(255,255,255,.30);

            color:#ffffff;

            font-size:9px;

            font-weight:800;

            letter-spacing:.5px;
        }


        /* =====================================================
                        FACE REGISTER TEXT
        ====================================================== */

        .face-register-text{

            margin-top:14px;

            text-align:center;

            font-size:13px;
        }


        .face-register-text a{

            color:#6f42c1;

            text-decoration:none;

            font-weight:700;
        }


        .face-register-text a:hover{

            text-decoration:underline;
        }


        /* =====================================================
                            DARK MODE
        ====================================================== */

        body.dark-mode .teacher-login-card{

            background:#111827;

            color:#ffffff;

            border:
                1px solid
                rgba(255,255,255,.08);
        }


        body.dark-mode .teacher-login-card
        .form-control{

            background:#334155;

            border-color:#475569;

            color:#ffffff;
        }


        body.dark-mode .teacher-login-card
        .form-control::placeholder{

            color:#cbd5e1;
        }


        body.dark-mode .teacher-login-card
        .form-label{

            color:#ffffff;
        }


        body.dark-mode .teacher-login-card
        .form-check-label{

            color:#ffffff;
        }


        body.dark-mode .face-register-text{

            color:#94a3b8;
        }


        body.dark-mode .face-register-text a{

            color:#22d3ee;
        }


        /* =====================================================
                            MOBILE
        ====================================================== */

        @media(max-width:576px){

            .teacher-login-card{

                padding:25px 20px;
            }


            .teacher-login-btn,
            .face-login-btn{

                min-height:50px;
            }

        }

    </style>

</head>


<body>


<!-- =========================================================
                        NAVBAR
========================================================= -->

<nav class="navbar navbar-expand-lg bg-white shadow-sm py-3">

    <div class="container">


        <!-- LOGO -->

        <a
            class="navbar-brand d-flex align-items-center text-decoration-none"
            href="../../index.html">


            <img
                src="../../images/logo.png"
                width="60"
                class="me-3"
                alt="FMPS Logo">


            <div>

                <h5
                    class="mb-0 fw-bold"
                    style="color:#6f42c1;">

                    FACULTY MANAGEMENT &
                    PRODUCTIVITY SYSTEM

                </h5>


                <small class="text-secondary">

                    Patna Women's College (Autonomous)

                </small>

            </div>

        </a>


        <!-- RIGHT NAVBAR -->

        <div class="d-flex align-items-center">


            <!-- THEME -->

            <button
                id="themeToggle"
                type="button"
                class="theme-btn me-3">

                <i class="fa-solid fa-moon"></i>

            </button>


            <!-- BACK -->

            <a
                href="../role-selection.html"
                class="text-decoration-none fw-bold text-dark">

                <i
                    class="fa-solid fa-arrow-left me-2"
                    style="color:#6f42c1;">
                </i>

                Back

            </a>

        </div>


    </div>

</nav>



<!-- =========================================================
                    TEACHER LOGIN SECTION
========================================================= -->

<section class="py-5">


    <div class="container">


        <div class="row justify-content-center">


            <div class="col-lg-5 col-md-7">


                <div class="help-card teacher-login-card">


                    <!-- =================================================
                                LOGIN HEADER
                    ================================================== -->

                    <div class="text-center mb-4">


                        <i
                            class="fa-solid fa-chalkboard-user
                                   fa-4x mb-3
                                   teacher-login-icon">
                        </i>


                        <br>


                        <span class="teacher-portal-badge">

                            Teacher Portal

                        </span>


                        <h2 class="fw-bold mt-3">

                            Teacher Login

                        </h2>


                        <p class="text-muted">

                            Sign in to access your Teacher Dashboard.

                        </p>


                    </div>



                    <!-- =================================================
                                NORMAL LOGIN FORM
                    ================================================== -->

                    <form
                        action="teacher-dashboard.html"
                        method="get">


                        <!-- EMAIL -->

                        <div class="mb-3">


                            <label
                                class="form-label fw-semibold">

                                Teacher Email

                            </label>


                            <input
                                type="email"
                                class="form-control"
                                placeholder="Enter Teacher Email"
                                required>


                        </div>



                        <!-- PASSWORD -->

                        <div class="mb-3">


                            <label
                                class="form-label fw-semibold">

                                Password

                            </label>


                            <input
                                type="password"
                                class="form-control"
                                placeholder="Enter Password"
                                required>


                        </div>



                        <!-- REMEMBER + FORGOT PASSWORD -->

                        <div
                            class="d-flex
                                   justify-content-between
                                   align-items-center
                                   mb-4">


                            <div class="form-check">


                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="remember">


                                <label
                                    class="form-check-label"
                                    for="remember">

                                    Remember Me

                                </label>


                            </div>



                            <a
                                href="#"
                                class="text-decoration-none fw-semibold"
                                style="color:#6f42c1;">

                                Forgot Password?

                            </a>


                        </div>



                        <!-- LOGIN BUTTON -->

                        <button
                            type="submit"
                            class="teacher-login-btn">

                            <i
                                class="fa-solid
                                       fa-right-to-bracket
                                       me-2">
                            </i>

                            Login

                        </button>


                    </form>



                    <!-- =================================================
                                OR DIVIDER
                    ================================================== -->

                    <div class="login-divider">

                        <span>OR</span>

                    </div>



                    <!-- =================================================
                            FACE RECOGNITION LOGIN
                    ================================================== -->

                    <button
                        type="button"
                        class="face-login-btn"
                        id="faceLoginBtn">


                        <i class="fa-solid fa-face-smile"></i>


                        <span>

                            Login with Face Recognition

                        </span>


                        <span class="face-ai-badge">

                            AI

                        </span>


                    </button>



                    <!-- =================================================
                            FACE REGISTRATION
                    ================================================== -->

                    <div class="face-register-text">

                        Face not registered?

                        <a href="face-register.html">

                            Register Face

                        </a>

                    </div>


                </div>


            </div>


        </div>


    </div>


</section>



<!-- =========================================================
                    BOOTSTRAP JAVASCRIPT
========================================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>



<!-- =========================================================
                        COMMON JS
========================================================= -->

<script src="../../js/script.js"></script>



<!-- =========================================================
                    FACE LOGIN JAVASCRIPT
========================================================= -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function(){

        const faceLoginBtn =
            document.getElementById(
                "faceLoginBtn"
            );


        if(faceLoginBtn){

            faceLoginBtn.addEventListener(
                "click",
                function(){

                    window.location.href =
                        "face-login.html";

                }
            );

        }

    }
);

</script>


</body>

</html>

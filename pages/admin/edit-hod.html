        </div>

    <!-- ===================================================== -->
    <!-- MAIN CONTENT -->
    <!-- ===================================================== -->

    <main class="main-content">


        <!-- TOPBAR -->

        <div class="topbar">

            <div>

                <h2>Edit HOD</h2>

                <p>Dashboard / HOD / Edit HOD</p>

            </div>


            <div class="topbar-actions">

                <button
                    id="themeToggle"
                    class="theme-toggle-btn">

                    <i class="fa-solid fa-moon"></i>

                </button>

            </div>

        </div>



        <!-- ================================================= -->
        <!-- FORM CARD -->
        <!-- ================================================= -->

        <div class="row justify-content-center mt-4">

            <div class="col-lg-10">

                <div class="chart-card">


                    <h4 class="mb-4">

                        <i class="fa-solid fa-user-pen"></i>

                        Update HOD Information

                    </h4>


                    <!-- Loading -->

                    <div
                        id="loadingMessage"
                        class="alert alert-info">

                        <i class="fa-solid fa-spinner fa-spin"></i>

                        Loading HOD details...

                    </div>


                    <!-- Error -->

                    <div
                        id="errorMessage"
                        class="alert alert-danger d-none">

                    </div>


                    <form
                        id="editHodForm"
                        style="display:none;">


                        <div class="row">


                            <!-- HOD ID -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    HOD ID
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="hodCode"
                                    readonly>

                            </div>


                            <!-- Full Name -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Full Name
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="hodName"
                                    required>

                            </div>


                            <!-- Email -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Email Address
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="hodEmail"
                                    required>

                            </div>


                            <!-- Mobile -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Mobile Number
                                </label>

                                <input
                                    type="tel"
                                    class="form-control"
                                    id="hodPhone">

                            </div>


                            <!-- Gender -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Gender
                                </label>

                                <select
                                    class="form-select"
                                    id="hodGender">

                                    <option value="">
                                        Select Gender
                                    </option>

                                    <option value="Male">
                                        Male
                                    </option>

                                    <option value="Female">
                                        Female
                                    </option>

                                    <option value="Other">
                                        Other
                                    </option>

                                </select>

                            </div>


                            <!-- DOB -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Date of Birth
                                </label>

                                <input
                                    type="date"
                                    class="form-control"
                                    id="hodDob">

                            </div>


                            <!-- Department -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Department
                                </label>

                                <select
                                    class="form-select"
                                    id="hodDepartment"
                                    required>

                                    <option value="">
                                        Select Department
                                    </option>

                                    <option value="1">
                                        Computer Science
                                    </option>

                                    <option value="2">
                                        Mathematics
                                    </option>

                                    <option value="3">
                                        Physics
                                    </option>

                                    <option value="4">
                                        Chemistry
                                    </option>

                                    <option value="5">
                                        Commerce
                                    </option>

                                    <option value="6">
                                        English
                                    </option>

                                    <option value="7">
                                        Economics
                                    </option>

                                    <option value="8">
                                        Hindi
                                    </option>

                                </select>

                            </div>


                            <!-- Qualification -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Qualification
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="hodQualification">

                            </div>


                            <!-- Experience -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Experience (Years)
                                </label>

                                <input
                                    type="number"
                                    class="form-control"
                                    id="hodExperience"
                                    min="0">

                            </div>


                            <!-- Salary -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Salary
                                </label>

                                <input
                                    type="number"
                                    class="form-control"
                                    id="hodSalary"
                                    min="0"
                                    step="0.01">

                            </div>


                            <!-- Joining Date -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Joining Date
                                </label>

                                <input
                                    type="date"
                                    class="form-control"
                                    id="hodJoiningDate">

                            </div>


                            <!-- Office Room -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Office Room No.
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="hodOfficeRoomNo"
                                    placeholder="Room 201">

                            </div>


                            <!-- Status -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Status
                                </label>

                                <select
                                    class="form-select"
                                    id="hodStatus">

                                    <option value="active">
                                        Active
                                    </option>

                                    <option value="inactive">
                                        Inactive
                                    </option>

                                </select>

                            </div>


                            <!-- Address -->

                            <div class="col-12 mb-3">

                                <label class="form-label">
                                    Address
                                </label>

                                <textarea
                                    class="form-control"
                                    id="hodAddress"
                                    rows="3"></textarea>

                            </div>


                            <!-- Username -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Username
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="hodUsername"
                                    required>

                            </div>


                            <!-- Password -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    New Password
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="hodPassword"
                                    placeholder="Leave blank to keep current password">

                            </div>


                            <!-- Photo -->

                            <div class="col-12 mb-4">

                                <label class="form-label">
                                    Profile Photo
                                </label>

                                <input
                                    type="file"
                                    class="form-control"
                                    id="photoInput"
                                    accept="image/*">


                                <div class="text-center mt-3">

                                    <img
                                        src="../../images/default-profile.png"
                                        id="photoPreview"
                                        alt="Profile Preview"
                                        class="rounded-circle border shadow"
                                        style="width:140px;height:140px;object-fit:cover;">

                                </div>

                            </div>


                        </div>


                        <!-- BUTTONS -->

                        <div
                            class="d-flex justify-content-end mt-3">

                            <a

                                Cancel

                            </a>


                            <button
                                type="submit"

<!-- ========================================================= -->
<!-- SCRIPTS -->
<!-- ========================================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script src="../../js/api.js"></script>

<script src="../../js/dashboard.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    async function () {


        // ====================================================
        // GET HOD ID FROM URL
        // ====================================================

        const params =
            new URLSearchParams(
                window.location.search
            );

        const hodId =
            params.get("id");


        const form =
            document.getElementById(
                "editHodForm"
            );


        const loadingMessage =
            document.getElementById(
                "loadingMessage"
            );


        const errorMessage =
            document.getElementById(
                "errorMessage"
            );


        // ====================================================
        // CHECK ID
        // ====================================================

        if (!hodId) {

            loadingMessage.style.display =
                "none";

            errorMessage.classList.remove(
                "d-none"
            );

            errorMessage.textContent =
                "HOD ID is missing.";

            return;

        }


        // ====================================================
        // LOAD HOD
        // ====================================================

        try {


            const response =
                await API.request(
                    "GET",
                    "/hods/" + hodId
                );


            console.log(
                "HOD details:",
                response
            );


            if (
                !response.success ||
                !response.data
            ) {

                throw new Error(
                    response.message ||
                    "HOD details not found."
                );

            }


            const hod =
                response.data;


            // =================================================
            // FILL FORM
            // =================================================

            document.getElementById(
                "hodCode"
            ).value =
                hod.hod_code || "";


            document.getElementById(
                "hodName"
            ).value =
                hod.full_name || "";


            document.getElementById(
                "hodEmail"
            ).value =
                hod.email || "";


            document.getElementById(
                "hodPhone"
            ).value =
                hod.phone || "";


            document.getElementById(
                "hodGender"
            ).value =
                hod.gender || "";


            document.getElementById(
                "hodDob"
            ).value =
                hod.dob || "";


            document.getElementById(
                "hodDepartment"
            ).value =
                hod.department_id || "";


            document.getElementById(
                "hodQualification"
            ).value =
                hod.qualification || "";


            document.getElementById(
                "hodExperience"
            ).value =
                hod.experience_years ?? 0;


            document.getElementById(
                "hodSalary"
            ).value =
                hod.salary ?? "";


            document.getElementById(
                "hodJoiningDate"
            ).value =
                hod.joining_date || "";


            document.getElementById(
                "hodOfficeRoomNo"
            ).value =
                hod.office_room_no || "";


            document.getElementById(
                "hodAddress"
            ).value =
                hod.address || "";


            document.getElementById(
                "hodUsername"
            ).value =
                hod.username || "";


            document.getElementById(
                "hodStatus"
            ).value =
                hod.status || "active";


            // =================================================
            // PHOTO
            // =================================================

            if (hod.photo_url) {

                let photoUrl =
                    hod.photo_url.replace(
                        /\\/g,
                        "/"
                    );


                if (
                    !photoUrl.startsWith(
                        "http"
                    )
                ) {

                    photoUrl =
                        "http://127.0.0.1:5000" +
                        photoUrl;

                }


                document.getElementById(
                    "photoPreview"
                ).src =
                    photoUrl;

            }


            // =================================================
            // SHOW FORM
            // =================================================

            loadingMessage.style.display =
                "none";

            form.style.display =
                "block";


        }

        catch (error) {

            console.error(
                "Load HOD error:",
                error
            );


            loadingMessage.style.display =
                "none";


            errorMessage.classList.remove(
                "d-none"
            );


            errorMessage.textContent =
                error.message ||
                "Failed to load HOD details.";

        }



        // ====================================================
        // PHOTO PREVIEW
        // ====================================================

        const photoInput =
            document.getElementById(
                "photoInput"
            );


        const photoPreview =
            document.getElementById(
                "photoPreview"
            );


        photoInput.addEventListener(
            "change",
            function () {


                const file =
                    this.files[0];


                if (file) {

                    const reader =
                        new FileReader();


                    reader.onload =
                        function (e) {

                            photoPreview.src =
                                e.target.result;

                        };


                    reader.readAsDataURL(
                        file
                    );

                }

            }
        );



        // ====================================================
        // UPDATE HOD
        // ====================================================

        form.addEventListener(
            "submit",
            async function (e) {

                e.preventDefault();


                const updateButton =
                    document.getElementById(
                        "updateButton"
                    );


                updateButton.disabled =
                    true;


                updateButton.innerHTML =
                    '<i class="fa-solid fa-spinner fa-spin"></i> Updating...';



                try {


                    // ==========================================
                    // FORM DATA
                    // ==========================================

                    const formData =
                        new FormData();


                    formData.append(
                        "full_name",
                        document.getElementById(
                            "hodName"
                        ).value.trim()
                    );


                    formData.append(
                        "email",
                        document.getElementById(
                            "hodEmail"
                        ).value.trim()
                    );


                    formData.append(
                        "phone",
                        document.getElementById(
                            "hodPhone"
                        ).value.trim()
                    );


                    formData.append(
                        "gender",
                        document.getElementById(
                            "hodGender"
                        ).value
                    );


                    formData.append(
                        "dob",
                        document.getElementById(
                            "hodDob"
                        ).value
                    );


                    formData.append(
                        "department_id",
                        document.getElementById(
                            "hodDepartment"
                        ).value
                    );


                    formData.append(
                        "qualification",
                        document.getElementById(
                            "hodQualification"
                        ).value.trim()
                    );


                    formData.append(
                        "experience_years",
                        document.getElementById(
                            "hodExperience"
                        ).value
                    );


                    formData.append(
                        "salary",
                        document.getElementById(
                            "hodSalary"
                        ).value
                    );


                    formData.append(
                        "office_room_no",
                        document.getElementById(
                            "hodOfficeRoomNo"
                        ).value.trim()
                    );


                    formData.append(
                        "joining_date",
                        document.getElementById(
                            "hodJoiningDate"
                        ).value
                    );


                    formData.append(
                        "address",
                        document.getElementById(
                            "hodAddress"
                        ).value.trim()
                    );


                    formData.append(
                        "username",
                        document.getElementById(
                            "hodUsername"
                        ).value.trim()
                    );


                    formData.append(
                        "status",
                        document.getElementById(
                            "hodStatus"
                        ).value
                    );


                    // ==========================================
                    // OPTIONAL PASSWORD
                    // ==========================================

                    const password =
                        document.getElementById(
                            "hodPassword"
                        ).value;


                    if (password) {

                        formData.append(
                            "password",
                            password
                        );

                    }


                    // ==========================================
                    // PHOTO
                    // ==========================================

                    const photo =
                        photoInput.files[0];


                    if (photo) {

                        formData.append(
                            "photo",
                            photo
                        );

                    }


                    console.log(
                        "Updating HOD..."
                    );


                    // ==========================================
                    // SEND PUT REQUEST
                    // ==========================================

                    const response =
                        await fetch(
                            "http://127.0.0.1:5000/api/hods/" +
                            hodId,
                            {
                                method: "PUT",
                                body: formData
                            }
                        );


                    const result =
                        await response.json();


                    console.log(
                        "Update response:",
                        result
                    );


                    if (
                        !response.ok ||
                        !result.success
                    ) {

                        throw new Error(
                            result.message ||
                            "HOD update failed."
                        );

                    }


                    alert(
                        "HOD updated successfully!"
                    );


                    // Return to list

                    window.location.href =
                        "hod-list.html";


                }

                catch (error) {

                    console.error(
                        "Update HOD error:",
                        error
                    );


                    alert(
                        error.message ||
                        "Failed to update HOD."
                    );


                    updateButton.disabled =
                        false;


                    updateButton.innerHTML =
                        '<i class="fa-solid fa-pen-to-square"></i> Update HOD';

                }

            }
        );

    }
);

</script>

</body>

</html>

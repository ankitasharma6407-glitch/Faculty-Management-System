<!-- ================= JavaScript ================= -->

<script>

// ================= Teacher Photo Preview =================

const teacherPhotoInput = document.getElementById("teacherPhotoInput");
const teacherPhotoPreview = document.getElementById("teacherPhotoPreview");

if(teacherPhotoInput){

teacherPhotoInput.addEventListener("change", function(){

const file = this.files[0];

if(file){

const reader = new FileReader();

reader.onload = function(e){

teacherPhotoPreview.src = e.target.result;

};

reader.readAsDataURL(file);

}

});

}

// ================= Form Validation =================

const teacherForm = document.getElementById("editTeacherForm");

if(teacherForm){

teacherForm.addEventListener("submit", function(e){

e.preventDefault();

const requiredFields = teacherForm.querySelectorAll("input[required], textarea[required], select[required]");

let isValid = true;

requiredFields.forEach(function(field){

if(field.value.trim() === ""){

field.classList.add("is-invalid");
field.classList.remove("is-valid");

isValid = false;

}else{

field.classList.remove("is-invalid");
field.classList.add("is-valid");

}

});

if(!isValid){

alert("Please fill all required fields.");

return;

}

// ================= Success Modal =================

const modal = new bootstrap.Modal(document.getElementById("updateTeacherModal"));

modal.show();

});

}

// ================= Reset Form =================

teacherForm.addEventListener("reset", function(){

setTimeout(function(){

document.querySelectorAll(".is-valid, .is-invalid").forEach(function(field){

field.classList.remove("is-valid");
field.classList.remove("is-invalid");

});

teacherPhotoPreview.src = "../../images/default-profile.png";

},100);

});

</script>

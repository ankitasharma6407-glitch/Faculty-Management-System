<!-- MAIN CONTENT -->
<!-- ===================================================== -->

<main class="main-content">


    <!-- TOPBAR -->

    <div class="topbar">

        <div>

            <h2>Add Student</h2>

            <p>
                Dashboard / Students / Add Student
            </p>

        </div>


        <div class="topbar-actions">

            <button
                id="themeToggle"
                class="theme-toggle-btn">

                <i class="fa-solid fa-moon"></i>

            </button>

        </div>

    </div>



    <!-- ================================================= -->
    <!-- STUDENT FORM -->
    <!-- ================================================= -->

    <div class="chart-card mt-4">

        <h3 class="mb-4">

            <i class="fa-solid fa-user-plus"></i>

            Student Registration Form

        </h3>


        <form id="studentForm">

            <div class="row">


                <!-- ======================================= -->
                <!-- PERSONAL INFORMATION -->
                <!-- ======================================= -->


                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Student ID
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="studentId"
                        placeholder="Enter Student ID"
                        required>

                </div>



                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Full Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="studentName"
                        placeholder="Enter Full Name"
                        required>

                </div>



                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Email Address
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="studentEmail"
                        placeholder="Enter Email Address"
                        required>

                </div>



                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        class="form-control"
                        id="studentPhone"
                        placeholder="Enter Mobile Number"
                        required>

                </div>



                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Gender
                    </label>

                    <select
                        class="form-select"
                        id="studentGender"
                        required>

                        <option value="">
                            Select Gender
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>



                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Date of Birth
                    </label>

                    <input
                        type="date"
                        class="form-control"
                        id="studentDob"
                        required>

                </div>



                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Blood Group
                    </label>

                    <select
                        class="form-select"
                        id="bloodGroup">

                        <option value="">
                            Select Blood Group
                        </option>

                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>

                    </select>

                </div>



                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Student Photo
                    </label>

                    <input
                        type="file"
                        class="form-control"
                        id="studentPhoto"
                        accept="image/*">

                </div>



                <!-- ======================================= -->
                <!-- ACADEMIC INFORMATION -->
                <!-- ======================================= -->


                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Course
                    </label>

                    <select
                        class="form-select"
                        id="course"
                        required>

                        <option value="">
                            Select Course
                        </option>

                        <option value="BCA">BCA</option>
                        <option value="BBA">BBA</option>
                        <option value="B.Sc">B.Sc</option>
                        <option value="B.Com">B.Com</option>
                        <option value="BA">BA</option>
                        <option value="MCA">MCA</option>
                        <option value="MBA">MBA</option>

                    </select>

                </div>



                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Department
                    </label>

                    <select
                        class="form-select"
                        id="department"
                        required>

                        <option value="">
                            Select Department
                        </option>

                        <option value="1">
                            Computer Science
                        </option>

                        <option value="2">
                            Mathematics
                        </option>

                        <option value="3">
                            Physics
                        </option>

                        <option value="4">
                            Chemistry
                        </option>

                        <option value="5">
                            Commerce
                        </option>

                        <option value="6">
                            English
                        </option>

                        <option value="7">
                            Economics
                        </option>

                        <option value="8">
                            Hindi
                        </option>

                    </select>

                </div>



                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Semester
                    </label>

                    <select
                        class="form-select"
                        id="semester"
                        required>

                        <option value="">
                            Select Semester
                        </option>

                        <option value="1st Semester">
                            1st Semester
                        </option>

                        <option value="2nd Semester">
                            2nd Semester
                        </option>

                        <option value="3rd Semester">
                            3rd Semester
                        </option>

                        <option value="4th Semester">
                            4th Semester
                        </option>

                        <option value="5th Semester">
                            5th Semester
                        </option>

                        <option value="6th Semester">
                            6th Semester
                        </option>

                    </select>

                </div>



                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Section
                    </label>

                    <select
                        class="form-select"
                        id="section">

                        <option value="">
                            Select Section
                        </option>

                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>

                    </select>

                </div>



                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Roll Number
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="rollNumber"
                        placeholder="Enter Roll Number"
                        required>

                </div>



                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Admission Date
                    </label>

                    <input
                        type="date"
                        class="form-control"
                        id="admissionDate"
                        required>

                </div>



                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Guardian Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="guardianName"
                        placeholder="Enter Guardian Name"
                        required>

                </div>



                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Guardian Mobile
                    </label>

                    <input
                        type="tel"
                        class="form-control"
                        id="guardianPhone"
                        placeholder="Enter Guardian Mobile Number"
                        required>

                </div>



                <div class="col-12 mb-3">

                    <label class="form-label">
                        Address
                    </label>

                    <textarea
                        class="form-control"
                        id="studentAddress"
                        rows="4"
                        placeholder="Enter Complete Address"
                        required></textarea>

                </div>



                <!-- ======================================= -->
                <!-- LOGIN DETAILS -->
                <!-- ======================================= -->


                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Username
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="username"
                        placeholder="Enter Username"
                        required>

                </div>



                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        placeholder="Enter Password"
                        required>

                </div>



                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="confirmPassword"
                        placeholder="Confirm Password"
                        required>

                </div>



                <div class="col-md-6 mb-4">

                    <label class="form-label">
                        Status
                    </label>

                    <select
                        class="form-select"
                        id="studentStatus">

                        <option value="active">
                            Active
                        </option>

                        <option value="inactive">
                            Inactive
                        </option>

                    </select>

                </div>



                <!-- ======================================= -->
                <!-- BUTTONS -->
                <!-- ======================================= -->


                <div class="col-12">

                    <div
                        class="d-flex justify-content-end gap-3 flex-wrap">


                        <a
                            href="student-list.html"
                            class="btn btn-secondary">

                            <i class="fa-solid fa-arrow-left"></i>

                            Back

                        </a>



                        <button
                            type="reset"
                            class="btn btn-warning">

                            <i class="fa-solid fa-rotate-left"></i>

                            Reset

                        </button>



                        <button
                            type="submit"
                            class="btn btn-success"
                            id="saveStudentButton">

                            <i class="fa-solid fa-floppy-disk"></i>

                            Save Student

                        </button>

                    </div>

                </div>

            </div>

        </form>

    </div>

</main>

</div>



<!-- ========================================================= -->
<!-- BOOTSTRAP -->
<!-- ========================================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<script src="../../js/api.js"></script>

<script src="../../js/dashboard.js"></script>



<!-- ========================================================= -->
<!-- ADD STUDENT JAVASCRIPT -->
<!-- ========================================================= -->

<script>

const studentForm =
    document.getElementById("studentForm");


if (studentForm) {

    studentForm.addEventListener(
        "submit",
        async function(e) {

            e.preventDefault();


            // =================================================
            // PASSWORD CHECK
            // =================================================

            const password =
                document.getElementById(
                    "password"
                ).value;


            const confirmPassword =
                document.getElementById(
                    "confirmPassword"
                ).value;


            if (password !== confirmPassword) {

                alert(
                    "Passwords do not match."
                );

                return;

            }


            // =================================================
            // FORM DATA
            // =================================================

            const formData =
                new FormData();


            formData.append(
                "student_code",
                document.getElementById(
                    "studentId"
                ).value.trim()
            );


            formData.append(
                "roll_number",
                document.getElementById(
                    "rollNumber"
                ).value.trim()
            );


            formData.append(
                "full_name",
                document.getElementById(
                    "studentName"
                ).value.trim()
            );


            formData.append(
                "email",
                document.getElementById(
                    "studentEmail"
                ).value.trim()
            );


            formData.append(
                "phone",
                document.getElementById(
                    "studentPhone"
                ).value.trim()
            );


            formData.append(
                "gender",
                document.getElementById(
                    "studentGender"
                ).value
            );


            formData.append(
                "dob",
                document.getElementById(
                    "studentDob"
                ).value
            );


            formData.append(
                "blood_group",
                document.getElementById(
                    "bloodGroup"
                ).value
            );


            formData.append(
                "course",
                document.getElementById(
                    "course"
                ).value
            );


            formData.append(
                "department_id",
                document.getElementById(
                    "department"
                ).value
            );


            formData.append(
                "semester",
                document.getElementById(
                    "semester"
                ).value
            );


            formData.append(
                "section",
                document.getElementById(
                    "section"
                ).value
            );


            formData.append(
                "admission_date",
                document.getElementById(
                    "admissionDate"
                ).value
            );


            formData.append(
                "guardian_name",
                document.getElementById(
                    "guardianName"
                ).value.trim()
            );


            formData.append(
                "guardian_phone",
                document.getElementById(
                    "guardianPhone"
                ).value.trim()
            );


            formData.append(
                "address",
                document.getElementById(
                    "studentAddress"
                ).value.trim()
            );


            formData.append(
                "username",
                document.getElementById(
                    "username"
                ).value.trim()
            );


            formData.append(
                "password",
                password
            );


            formData.append(
                "status",
                document.getElementById(
                    "studentStatus"
                ).value
            );


            // =================================================
            // PHOTO
            // =================================================

            const photoInput =
                document.getElementById(
                    "studentPhoto"
                );


            if (
                photoInput.files.length > 0
            ) {

                formData.append(
                    "photo",
                    photoInput.files[0]
                );

            }


            // =================================================
            // BUTTON
            // =================================================

            const saveButton =
                document.getElementById(
                    "saveStudentButton"
                );


            saveButton.disabled = true;


            saveButton.innerHTML =
                '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';



            // =================================================
            // SEND TO FLASK
            // =================================================

            try {


                const response =
                    await fetch(
                        "http://127.0.0.1:5000/api/students",
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                const result =
                    await response.json();


                console.log(
                    "Student API Response:",
                    result
                );


                if (
                    !response.ok ||
                    !result.success
                ) {

                    throw new Error(
                        result.message ||
                        "Failed to add student."
                    );

                }


                alert(
                    "Student added successfully!"
                );


                // Clear form

                studentForm.reset();


                // Go to list

                window.location.href =
                    "student-list.html";


            }

            catch (error) {

                console.error(
                    "Add student error:",
                    error
                );


                alert(
                    error.message ||
                    "Failed to add student."
                );


                saveButton.disabled = false;


                saveButton.innerHTML =
                    '<i class="fa-solid fa-floppy-disk"></i> Save Student';

            }

        }
    );

}

</script>

</body>

<!-- ================= Main Content ================= -->

<main class="main-content">

<div class="topbar">

<div>

<h2>Add Student</h2>

<p>Dashboard / Students / Add Student</p>

</div>
<div class="topbar-actions">

    <button id="themeToggle" class="theme-toggle-btn">
        <i class="fa-solid fa-moon"></i>
    </button>

</div>
</div>

<div class="chart-card mt-4">

<h3 class="mb-4">

<i class="fa-solid fa-user-plus"></i>

Student Registration Form

</h3>

<form id="studentForm">

<div class="row">
<!-- ================= Personal Information ================= -->

<div class="col-md-6 mb-3">

<label class="form-label">

Student ID

</label>

<input
type="text"
class="form-control"
id="studentId"
placeholder="Enter Student ID"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Full Name

</label>

<input
type="text"
class="form-control"
id="studentName"
placeholder="Enter Full Name"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Email Address

</label>

<input
type="email"
class="form-control"
id="studentEmail"
placeholder="Enter Email Address"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Mobile Number

</label>

<input
type="tel"
class="form-control"
id="studentPhone"
placeholder="Enter Mobile Number"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Gender

</label>

<select
class="form-select"
id="studentGender"
required>

<option value="">Select Gender</option>

<option>Male</option>

<option>Female</option>

<option>Other</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Date of Birth

</label>

<input
type="date"
class="form-control"
id="studentDob"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Blood Group

</label>

<select
class="form-select"
id="bloodGroup">

<option value="">Select Blood Group</option>

<option>A+</option>
<option>A-</option>
<option>B+</option>
<option>B-</option>
<option>AB+</option>
<option>AB-</option>
<option>O+</option>
<option>O-</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Student Photo

</label>

<input
type="file"
class="form-control"
id="studentPhoto"
accept="image/*">

</div>
<!-- ================= Academic Information ================= -->

<div class="col-md-6 mb-3">

<label class="form-label">

Course

</label>

<select
class="form-select"
id="course"
required>

<option value="">Select Course</option>

<option>BCA</option>
<option>BBA</option>
<option>B.Sc</option>
<option>B.Com</option>
<option>BA</option>
<option>MCA</option>
<option>MBA</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Department

</label>

<select
class="form-select"
id="department"
required>

<option value="">Select Department</option>

<option>Computer Science</option>
<option>Commerce</option>
<option>Mathematics</option>
<option>Physics</option>
<option>Chemistry</option>
<option>English</option>
<option>Hindi</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Semester

</label>

<select
class="form-select"
id="semester"
required>

<option value="">Select Semester</option>

<option>1st Semester</option>
<option>2nd Semester</option>
<option>3rd Semester</option>
<option>4th Semester</option>
<option>5th Semester</option>
<option>6th Semester</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Section

</label>

<select
class="form-select"
id="section">

<option value="">Select Section</option>

<option>A</option>
<option>B</option>
<option>C</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Roll Number

</label>

<input
type="text"
class="form-control"
id="rollNumber"
placeholder="Enter Roll Number"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Admission Date

</label>

<input
type="date"
class="form-control"
id="admissionDate"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Guardian Name

</label>

<input
type="text"
class="form-control"
id="guardianName"
placeholder="Enter Guardian Name"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Guardian Mobile

</label>

<input
type="tel"
class="form-control"
id="guardianPhone"
placeholder="Enter Guardian Mobile Number"
required>

</div>

<div class="col-12 mb-3">

<label class="form-label">

Address

</label>

<textarea
class="form-control"
id="studentAddress"
rows="4"
placeholder="Enter Complete Address"
required></textarea>

</div>
<!-- ================= Login Account Details ================= -->

<div class="col-md-6 mb-3">

<label class="form-label">

Username

</label>

<input
type="text"
class="form-control"
id="username"
placeholder="Enter Username"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Password

</label>

<input
type="password"
class="form-control"
id="password"
placeholder="Enter Password"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Confirm Password

</label>

<input
type="password"
class="form-control"
id="confirmPassword"
placeholder="Confirm Password"
required>

</div>

<div class="col-md-6 mb-4">

<label class="form-label">

Status

</label>

<select
class="form-select"
id="studentStatus">

<option value="Active">Active</option>

<option value="Inactive">Inactive</option>

</select>

</div>

<!-- ================= Buttons ================= -->

<div class="col-12">

<div class="d-flex justify-content-end gap-3 flex-wrap">

<a
href="student-list.html"
class="btn btn-secondary">

<i class="fa-solid fa-arrow-left"></i>

Back

</a>

<button
type="reset"
class="btn btn-warning">

<i class="fa-solid fa-rotate-left"></i>

Reset

</button>

<button
type="submit"
class="btn btn-success">

<i class="fa-solid fa-floppy-disk"></i>

Save Student

</button>

</div>

</div>

</div>

</form>

</div>

</main>

</div>

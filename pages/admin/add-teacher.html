<!-- ================= Main Content ================= -->

<main class="main-content">

<div class="topbar">

<div>

<h2>Add Teacher</h2>

<p>Dashboard / Teachers / Add Teacher</p>

</div>
<div class="topbar-actions">

    <button id="themeToggle" class="theme-toggle-btn">
        <i class="fa-solid fa-moon"></i>
    </button>

</div>
</div>

<div class="chart-card mt-4">

<h3 class="mb-4">

<i class="fa-solid fa-user-plus"></i>

Teacher Registration Form

</h3>

<form id="teacherForm">

<div class="row">
<!-- ================= Personal Information ================= -->

<div class="col-md-6 mb-3">

<label class="form-label">

Teacher ID

</label>

<input
type="text"
class="form-control"
id="teacherId"
placeholder="Enter Teacher ID"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Full Name

</label>

<input
type="text"
class="form-control"
id="teacherName"
placeholder="Enter Full Name"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Email Address

</label>

<input
type="email"
class="form-control"
id="teacherEmail"
placeholder="Enter Email"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Mobile Number

</label>

<input
type="tel"
class="form-control"
id="teacherPhone"
placeholder="Enter Mobile Number"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Gender

</label>

<select
class="form-select"
id="teacherGender"
required>

<option value="">Select Gender</option>

<option>Male</option>

<option>Female</option>

<option>Other</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Date of Birth

</label>

<input
type="date"
class="form-control"
id="teacherDob"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Blood Group

</label>

<select
class="form-select"
id="bloodGroup">

<option value="">Select Blood Group</option>

<option>A+</option>
<option>A-</option>
<option>B+</option>
<option>B-</option>
<option>AB+</option>
<option>AB-</option>
<option>O+</option>
<option>O-</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Profile Photo

</label>

<input
type="file"
class="form-control"
id="teacherPhoto"
accept="image/*">

</div>
<!-- ================= Professional Information ================= -->

<div class="col-md-6 mb-3">

<label class="form-label">

Department

</label>

<select
class="form-select"
id="teacherDepartment"
required>

<option value="">Select Department</option>

<option>Computer Science</option>
<option>Mathematics</option>
<option>Physics</option>
<option>Chemistry</option>
<option>Commerce</option>
<option>English</option>
<option>Hindi</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Designation

</label>

<select
class="form-select"
id="teacherDesignation"
required>

<option value="">Select Designation</option>

<option>Assistant Professor</option>
<option>Associate Professor</option>
<option>Professor</option>
<option>Guest Faculty</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Qualification

</label>

<input
type="text"
class="form-control"
id="teacherQualification"
placeholder="e.g. M.Tech, Ph.D"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Experience (Years)

</label>

<input
type="number"
class="form-control"
id="teacherExperience"
placeholder="Enter Experience">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Joining Date

</label>

<input
type="date"
class="form-control"
id="joiningDate"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Salary

</label>

<input
type="number"
class="form-control"
id="teacherSalary"
placeholder="Enter Salary">

</div>

<div class="col-12 mb-3">

<label class="form-label">

Residential Address

</label>

<textarea
class="form-control"
id="teacherAddress"
rows="4"
placeholder="Enter Complete Address"
required></textarea>

</div>
<!-- ================= Account Details ================= -->

<div class="col-md-6 mb-3">

<label class="form-label">

Username

</label>

<input
type="text"
class="form-control"
id="username"
placeholder="Enter Username"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Password

</label>

<input
type="password"
class="form-control"
id="password"
placeholder="Enter Password"
required>

</div>

<div class="col-md-6 mb-4">

<label class="form-label">

Confirm Password

</label>

<input
type="password"
class="form-control"
id="confirmPassword"
placeholder="Confirm Password"
required>

</div>

<div class="col-md-6 mb-4">

<label class="form-label">

Status

</label>

<select
class="form-select"
id="teacherStatus">

<option value="Active">Active</option>

<option value="Inactive">Inactive</option>

</select>

</div>

<!-- ================= Buttons ================= -->

<div class="col-12">

<div class="d-flex justify-content-end gap-3 flex-wrap">

<a
href="teacher-list.html"
class="btn btn-secondary">

<i class="fa-solid fa-arrow-left"></i>

Back

</a>

<button
type="reset"
class="btn btn-warning">

<i class="fa-solid fa-rotate-left"></i>

Reset

</button>

<button
type="submit"
class="btn btn-success">

<i class="fa-solid fa-floppy-disk"></i>

Save Teacher

</button>

</div>

</div>

</div>

</form>

</div>

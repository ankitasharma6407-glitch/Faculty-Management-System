<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HOD Login | FMPS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="../../css/style.css">

</head>

<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg bg-white shadow-sm py-3">

    <div class="container">

        <a class="navbar-brand d-flex align-items-center text-decoration-none"
            href="../../index.html">

            <img src="../../images/logo.png" width="60" class="me-3">

            <div>

                <h5 class="mb-0 fw-bold" style="color:#6f42c1;">
                    FACULTY MANAGEMENT &
                    PRODUCTIVITY SYSTEM
                </h5>

                <small class="text-secondary">
                    Patna Women's College (Autonomous)
                </small>

            </div>

        </a>
              <div class="d-flex align-items-center">

    <button id="themeToggle" class="theme-btn me-3">
        <i class="fa-solid fa-moon"></i>
    </button>

    <a href="../role-selection.html"
       class="text-decoration-none fw-bold text-dark">

        <i class="fa-solid fa-arrow-left me-2"
           style="color:#6f42c1;"></i>

        Back

    </a>

</div>

    </div>

</nav>

<!-- Login Section -->

<section class="py-5">

<div class="container">

<div class="row justify-content-center">

<div class="col-lg-5">

<div class="help-card">

<div class="text-center mb-4">

<i class="fa-solid fa-user-tie fa-4x mb-3"
style="color:#6f42c1;"></i>

<span class="badge bg-primary rounded-pill px-4 py-2">

HOD Portal

</span>

<h2 class="fw-bold mt-3">

HOD Login

</h2>

<p class="text-muted">

Sign in to access your Head of Department Dashboard.

</p>

</div>

<form action="hod-dashboard.html" method="get">

<div class="mb-3">

<label class="form-label fw-semibold">

HOD Email

</label>

<input type="email"
class="form-control"
placeholder="Enter HOD Email"
required>

</div>

<div class="mb-3">

<label class="form-label fw-semibold">

Password

</label>

<input type="password"
class="form-control"
placeholder="Enter Password"
required>

</div>

<div class="d-flex justify-content-between align-items-center mb-4">

<div class="form-check">

<input class="form-check-input"
type="checkbox"
id="remember">

<label class="form-check-label"
for="remember">

Remember Me

</label>

</div>

<a href="#"
class="text-decoration-none fw-semibold"
style="color:#6f42c1;">

Forgot Password?

</a>

</div>

<div class="d-grid">

    <button type="submit"
    class="btn btn-primary btn-lg rounded-pill">

        <i class="fa-solid fa-right-to-bracket me-2"></i>

        Login

    </button>

</div>

</form>


<!-- ================= OR ================= -->

<div class="d-flex align-items-center my-4">

    <hr class="flex-grow-1">

    <span class="mx-3 text-muted fw-semibold">
        OR
    </span>

    <hr class="flex-grow-1">

</div>


<!-- ================= FACE LOGIN ================= -->

<div class="d-grid">

    <a href="face-login.html"
       class="btn face-login-btn">

        <div class="face-login-content">

            <div class="face-scan-icon">

                <i class="fa-solid fa-expand"></i>

                <i class="fa-solid fa-face-smile"></i>

            </div>


            <div class="text-start">

                <div class="face-login-title">
                    Login with Face Recognition
                </div>

                <div class="face-login-subtitle">
                    Use Face Recognition to Login
                </div>

            </div>

        </div>

    </a>

</div>


<hr class="my-4">






</div>

</div>

</div>

</div>

</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../js/script.js"></script>
</body>

</html>
